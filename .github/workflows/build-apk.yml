name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Prepare Android Project
        run: |
          cd mobile
          # Back up our manifest and icons
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          mkdir -p /tmp/res_backup
          cp -r android/app/src/main/res/* /tmp/res_backup/ || true

          # Recreate Android scaffolding with Flutter's official matching Gradle/AGP config
          rm -rf android
          flutter create --platforms android --org com.moamenmoheb .

          # Restore our custom AndroidManifest and icons
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r /tmp/res_backup/* android/app/src/main/res/

          # Ensure gradlew has executable permissions
          chmod +x android/gradlew

      - name: Install Flutter Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Prepare APK Output
        run: |
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-release.apk dist/adhkar-sanctuary-v1.0.0.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adhkar-sanctuary-apk
          path: dist/adhkar-sanctuary-v1.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          git tag -d v1.0.0 || true
          gh release create v1.0.0 dist/adhkar-sanctuary-v1.0.0.apk \
            --title "تطبيق أذكار - الإصدار 1.0.0 (Adhkar Sanctuary APK)" \
            --notes "تطبيق أذكار الهادئ - أندرويد APK جاهز للتحميل والتثبيت المباشر على الهاتف. يتضمن: لوحة المتصدرين المفصولة للرجال والنساء، 20 صورة رمزية إسلامية، المسبحة الإلكترونية، والورد اليومي مع إدارة الصلاحيات للمشرف والمستخدم العادي." \
            --latest
